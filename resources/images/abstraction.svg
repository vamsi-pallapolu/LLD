<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Abstraction</title><desc id="desc">Receipt code requests a visitor name and price through the public interface. Ticket storage or calculation can change while the receipt still gets Maya and 1500 cents.</desc>
<rect x="0" y="0" width="1200" height="440" rx="0" fill="#f6f8fb"/>
<text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#18334b">Abstraction</text>
<rect x="40" y="100" width="320" height="270" rx="16" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
<circle cx="200" cy="139" r="13" fill="#2563a6"/>
<rect x="177" y="156" width="46" height="25" rx="12" fill="#2563a6"/>
<text x="200" y="215" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#18334b">Receipt code asks</text>
<text x="200" y="260" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#2563a6">visitor()</text>
<text x="200" y="301" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#2563a6">priceCents()</text>
<line x1="367" y1="235" x2="433" y2="235" stroke="#536b80" stroke-width="3"/>
<polygon points="433,235 423,229 423,241" fill="#536b80"/>
<rect x="440" y="100" width="320" height="270" rx="16" fill="#e7f5f3"/>
<text x="600" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#18334b">Inside the ticket</text>
<text x="600" y="205" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#18334b">Storage or calculation</text>
<text x="600" y="254" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#087e80">may change</text>
<text x="600" y="316" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#18334b">Same public requests</text>
<line x1="767" y1="235" x2="833" y2="235" stroke="#536b80" stroke-width="3"/>
<polygon points="833,235 823,229 823,241" fill="#536b80"/>
<rect x="840" y="100" width="320" height="270" rx="16" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
<rect x="905" y="135" width="190" height="205" rx="8" fill="#fff8e7" stroke="#eadbb6" stroke-width="2"/>
<text x="1000" y="180" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#a76d15">RECEIPT</text>
<line x1="929" y1="201" x2="1071" y2="201" stroke="#eadbb6" stroke-width="2"/>
<text x="1000" y="245" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#18334b">Maya</text>
<text x="1000" y="295" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#a76d15">1500 cents</text>
<text x="600" y="419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#536b80">The caller depends on the request and its promise, not internal details.</text>
</svg>
