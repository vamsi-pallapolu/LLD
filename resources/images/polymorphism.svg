<text x="133" y="287" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#18334b">Maya / AdultTicket</text>
<text x="133" y="342" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#2563a6">1500 cents</text>
<line x1="600" y1="225" x2="600" y2="250" stroke="#536b80" stroke-width="3"/>
<polygon points="600,250 594,240 606,240" fill="#536b80"/>
<rect x="425" y="250" width="350" height="130" rx="16" fill="#ffffff" stroke="#dce4ed" stroke-width="2"/>
