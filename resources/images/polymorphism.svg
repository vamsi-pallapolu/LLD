<text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#18334b">Polymorphism</text>
<rect x="365" y="80" width="470" height="115" rx="16" fill="#e7eefb"/>
<text x="600" y="121" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#18334b">printReceipt(ticket)</text>
<text x="600" y="161" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#2563a6">Calls virtual priceCents()</text>
<line x1="600" y1="195" x2="600" y2="225" stroke="#536b80" stroke-width="3"/>
<line x1="225" y1="225" x2="975" y2="225" stroke="#536b80" stroke-width="3"/>
