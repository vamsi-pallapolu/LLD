<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Polymorphism</title><desc id="desc">One printReceipt function calls virtual priceCents through a base reference. The actual adult, child, or senior ticket returns its own price.</desc>
